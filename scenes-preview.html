<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>부산기 · 장소와 행동 미리보기</title><link rel="stylesheet" href="style.css">
<style>
body{padding:18px;background:#f5f5f2}main{display:block;max-width:1100px;margin:auto;padding:0}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}h1{font-size:20px;margin:0}a{font-size:12px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}label{display:flex;gap:8px;align-items:center;font-size:12px}select{font:inherit;padding:8px;border:1px solid #111;border-radius:8px;background:white;color:#111}.scene.has-background{height:clamp(240px,calc(100svh - 155px),540px);margin:0}.scene figcaption{padding:12px 18px}p{font-size:11px;color:#666;margin:10px 0 0}@media(max-width:650px){body{padding:12px}h1{font-size:16px}.scene.has-background{height:clamp(260px,calc(100svh - 165px),510px)}}
</style></head><body><main>
<header><h1>부산기, 부산에서 보내는 하루.</h1><a href="index.html#map">게임으로 돌아가기</a></header>
<nav aria-label="장면 선택"><label>장소 <select id="place"></select></label><label>행동 <select id="action"><option value="cafe">음료 마시기</option><option value="meal">밥 먹기</option><option value="view">경치 구경</option><option value="idle">인사하기</option><option value="park">놀이기구 타기</option><option value="pc">PC방</option><option value="karaoke">노래방</option><option value="movie">영화 감상</option></select></label></nav>
<figure class="scene has-background"><div class="scene-background" aria-hidden="true"></div><span class="scene-action-label"></span><img class="character" alt=""><figcaption><strong></strong><span></span></figcaption></figure>
<p>제공한 장소 사진을 바탕으로 제작한 컬러 일러스트와 흑백 부산기. 이 미리보기는 게임 재화나 진행 상황을 바꾸지 않아.</p>
</main><script src="scene-assets.js"></script><script>
const names={gwangalli:'광안리',gamcheon:'감천문화마을',huinnyeoul:'흰여울문화마을',nampo:'남포동·자갈치',haeundae:'해운대',songdo:'송도',dadaepo:'다대포',station:'부산역',lotteworld:'부산 롯데월드','pc-room':'PC방','karaoke-room':'노래방',cinema:'영화관'};
const place=document.getElementById('place'),action=document.getElementById('action'),figure=document.querySelector('figure');
for(const [id,name] of Object.entries(names))place.add(new Option(name,id));
function render(){const s=BusangiScenes.resolve({location:place.value,activity:['park','pc','karaoke','movie'].includes(action.value)?'leisure':action.value,study:{running:false},rest:{running:false},lastConsumed:action.value});figure.style.setProperty('--actor-x',s.layout.x+'%');figure.style.setProperty('--actor-height',s.layout.height+'%');figure.style.setProperty('--actor-bottom',s.layout.bottom+'px');figure.querySelector('.scene-background').style.backgroundImage='url('+JSON.stringify(s.background)+')';figure.querySelector('.scene-background').style.backgroundPosition=s.layout.backgroundPosition;const img=figure.querySelector('img');img.src=s.src;img.alt=s.alt;figure.querySelector('strong').textContent=names[s.location];figure.querySelector('figcaption span').textContent=s.label;figure.querySelector('.scene-action-label').textContent=s.label;}
const venues={park:'lotteworld',pc:'pc-room',karaoke:'karaoke-room',movie:'cinema'};place.addEventListener('change',()=>{action.value=({'pc-room':'pc','karaoke-room':'karaoke',cinema:'movie',lotteworld:'park'})[place.value]||'view';render();});action.addEventListener('change',()=>{if(venues[action.value])place.value=venues[action.value];render();});render();
</script></body></html>
