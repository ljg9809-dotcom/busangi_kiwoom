<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산기 · 옷 입어보기</title><link rel="stylesheet" href="style.css"><style>
body{background:#f5f5f2;padding:18px}main{display:block;max-width:1100px;margin:auto;padding:0}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}h1{font-size:21px;margin:0}header a{font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.controls label{display:flex;gap:6px;align-items:center;font-size:12px}select{font:inherit;padding:7px;border-radius:8px;background:white;color:#111;border:1px solid #111}.scene{height:clamp(270px,calc(100svh - 195px),540px)!important;min-height:0!important;margin-bottom:8px}.scene .character{height:73%;margin:10px 0 60px;max-width:65%}.scene.has-background .character{height:var(--actor-height)}p{font-size:11px;color:#666}input[type=checkbox]{width:auto}#render-state{margin:6px 0}#wardrobe-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}#wardrobe-gallery .card{padding:12px}#wardrobe-gallery h2{font-size:15px}#wardrobe-gallery button{font-size:11px}.clothing-icon{margin-bottom:8px}@media(max-width:650px){body{padding:12px}h1{font-size:17px}.scene{height:300px!important}}
</style></head><body><main>
<header><h1>부산기, 오늘은 어떤 옷 입을까?</h1><a href="index.html#closet">게임 옷장으로</a></header>
<div class="controls"><label>행동 <select id="pose"><option value="rest">휴식</option><option value="idle">인사</option><option value="eat">식사</option><option value="drink">음료</option><option value="view">경치 감상</option><option value="study">공부</option><option value="pc">PC방</option><option value="karaoke">노래방</option><option value="movie">영화</option><option value="park">놀이공원</option></select></label><label>상의 <select id="top"><option value="">기본</option></select></label><label><input type="checkbox" id="jacket">재킷</label><label><input type="checkbox" id="shoes">운동화</label><label><input type="checkbox" id="hat">모자</label><label><input type="checkbox" id="pants">바지</label><label><input type="checkbox" id="set">부산 세트</label></div>
<figure class="scene"><div class="scene-background"></div><span class="scene-action-label"></span><img class="character" id="avatar" alt=""><figcaption><strong id="place-name"></strong><span id="outfit-name"></span></figcaption></figure>
<p id="render-state" aria-live="polite"></p><p>입어보기 전용 페이지야. 게임머니·구매 기록·실제 착용 상태는 바뀌지 않아.</p><div id="wardrobe-gallery"></div>
</main><script src="busangi-game.js"></script><script src="scene-assets.js"></script><script src="wardrobe-renderer.js"></script><script>
const $=id=>document.getElementById(id),clothes=BusangiGame.data.clothes,avatar=$('avatar'),figure=document.querySelector('figure');
document.querySelectorAll('input[type="checkbox"]').forEach(el=>el.style.accentColor='#111');
for(const item of clothes){if(item.slot==='top')$('top').add(new Option(item.name,item.id));const card=document.createElement('article');card.className='card';const icon=document.createElement('div');icon.className='clothing-icon';icon.style.backgroundImage='url('+JSON.stringify(item.image)+')';icon.style.backgroundPosition=(item.frame%3)*50+'% '+Math.floor(item.frame/3)*50+'%';icon.setAttribute('role','img');icon.setAttribute('aria-label',item.name);const name=document.createElement('h2');name.textContent=item.name;const price=document.createElement('p');price.textContent=item.price.toLocaleString('ko-KR')+'원';const button=document.createElement('button');button.textContent='입어보기';button.onclick=()=>{if(item.slot==='top'){$('top').value=item.id;$('set').checked=false;$('jacket').checked=false;}else $( {outer:'jacket',shoes:'shoes',hat:'hat',bottom:'pants',set:'set'}[item.slot]).checked=true;render();figure.scrollIntoView({behavior:'smooth',block:'start'});};card.append(icon,name,price,button);$('wardrobe-gallery').append(card);}
const poseMap={idle:['station','idle'],eat:['nampo','meal'],drink:['gwangalli','cafe'],view:['dadaepo','view'],rest:['home','rest'],study:['station','study'],pc:['station','leisure'],karaoke:['station','leisure'],movie:['station','leisure'],park:['lotteworld','leisure']};
function render(){const action=$('pose').value,[location,activity]=poseMap[action],s=BusangiScenes.resolve({location,activity,study:{running:false},rest:{running:false},lastConsumed:action});let equipped={};if($('top').value)equipped.top=$('top').value;if($('jacket').checked)equipped.outer='jacket';if($('shoes').checked)equipped.shoes='sneakers';if($('hat').checked)equipped.hat='cap';if($('pants').checked)equipped.bottom='pants';if($('set').checked)equipped={set:'busan-set'};const names=Object.values(equipped).map(id=>clothes.find(i=>i.id===id).name).join(', ')||'기본 부산기';figure.classList.toggle('has-background',!!s.background);figure.style.setProperty('--actor-x',s.layout.x+'%');figure.style.setProperty('--actor-height',s.layout.height+'%');figure.style.setProperty('--actor-bottom',s.layout.bottom+'px');const bg=figure.querySelector('.scene-background');bg.style.backgroundImage=s.background?'url('+JSON.stringify(s.background)+')':'none';bg.style.backgroundPosition=s.layout.backgroundPosition;figure.querySelector('.scene-action-label').textContent=s.label;$('place-name').textContent=s.label;$('outfit-name').textContent=names;$('render-state').textContent='옷을 준비하고 있어…';BusangiWardrobe.apply(avatar,s,equipped,names).then(()=>{$('render-state').textContent=avatar.dataset.wardrobeStatus==='error'?'이미지 로딩 실패. 새로고침해줘.':'착용 장면 준비 완료';});}
document.querySelectorAll('.controls input,.controls select').forEach(el=>el.addEventListener('change',render));$('top').value='hoodie';render();
</script></body></html>
